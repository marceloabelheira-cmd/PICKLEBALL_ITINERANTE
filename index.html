<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pickleball Itinerante — Vídeos do canal organizados</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --bola:#C8E03C; --bola-esc:#8FA61C; --bola-claro:#F4FAD6;
  --tinta:#16211B; --tinta2:#22322A; --cinza:#66706A; --linha:#E2E6DC;
  --fundo:#F8FAF4; --branco:#fff;
  --c-loc:#2E7D4F; --c-are:#0E6E8C; --c-tor:#B5481F; --c-luz:#B98500; --c-uni:#6A4C93; --c-vis:#4F5B66;
  --raio:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--fundo);color:var(--tinta);line-height:1.45}
a{color:inherit}
button{font:inherit;cursor:pointer;color:inherit}

header.topo{background:var(--tinta);color:#fff;position:sticky;top:0;z-index:1000;border-bottom:4px solid var(--bola)}
.topo-in{max-width:1240px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:14px}
.logo{width:42px;height:42px;border-radius:50%;background:var(--bola);display:grid;place-items:center;flex:none;position:relative}
.logo::before{content:"";width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#16211B 0 2px,transparent 2.5px),radial-gradient(circle at 70% 35%,#16211B 0 2px,transparent 2.5px),radial-gradient(circle at 45% 70%,#16211B 0 2px,transparent 2.5px),radial-gradient(circle at 75% 72%,#16211B 0 1.6px,transparent 2px),radial-gradient(circle at 22% 62%,#16211B 0 1.6px,transparent 2px);background-color:#E7F48A;border:2px solid #16211B}
.topo h1{font-size:17px;font-weight:700;letter-spacing:.2px}
.topo small{display:block;color:#C3CCC6;font-size:12.5px;font-weight:400}
.topo .home-btn{margin-left:auto;background:transparent;border:1px solid #4d5a52;color:#fff;border-radius:999px;padding:6px 14px;font-size:13px;white-space:nowrap}
.topo .home-btn:hover{border-color:var(--bola);color:var(--bola)}

main{max-width:1240px;margin:0 auto;padding:24px 20px 60px}

.hero{background:linear-gradient(120deg,var(--tinta) 0%,var(--tinta2) 60%,#33441f 100%);color:#fff;border-radius:var(--raio);padding:34px 32px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,var(--bola) 0%,rgba(200,224,60,0) 70%);opacity:.35}
.hero .tag{display:inline-block;background:var(--bola);color:var(--tinta);font-weight:700;font-size:12px;padding:4px 10px;border-radius:999px;letter-spacing:.5px;text-transform:uppercase}
.hero h2{font-size:30px;margin:12px 0 8px;line-height:1.15}
.hero p{color:#D5DDD8;max-width:760px;font-size:15px}
.hero .nums{display:flex;gap:28px;margin-top:20px;flex-wrap:wrap;position:relative;z-index:1}
.hero .nums b{display:block;font-size:26px;color:var(--bola)}
.hero .nums span{font-size:12.5px;color:#C3CCC6}

.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:24px}
.card-main{background:var(--branco);border-radius:var(--raio);overflow:hidden;border:1px solid var(--linha);display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s}
.card-main:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(0,0,0,.09)}
.card-main .capa{height:140px;background-size:cover;background-position:center;position:relative;cursor:pointer}
.card-main .capa::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 25%,rgba(0,0,0,.75))}
.card-main .capa .ttl{position:absolute;left:16px;bottom:12px;right:16px;color:#fff;font-weight:700;font-size:19px;line-height:1.2}
.card-main .faixa{height:5px}
.card-main .corpo{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
.card-main .qtd{font-size:13px;color:var(--cinza)}
.card-main ul{list-style:none;display:flex;flex-direction:column;gap:6px}
.card-main li button{width:100%;text-align:left;background:var(--fundo);border:1px solid var(--linha);border-radius:10px;padding:7px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13.5px}
.card-main li button:hover{border-color:var(--bola-esc);background:var(--bola-claro)}
.card-main li .n{font-size:12px;color:var(--cinza);background:#fff;border:1px solid var(--linha);border-radius:999px;padding:1px 8px;flex:none}
.card-main .abrir{margin-top:auto;background:var(--tinta);color:#fff;border:0;border-radius:10px;padding:10px;font-weight:600}
.card-main .abrir:hover{background:var(--bola);color:var(--tinta)}

.secao{margin-top:34px}
.secao h3{font-size:20px;display:flex;align-items:center;gap:10px}
.secao h3::before{content:"";width:6px;height:22px;background:var(--bola-esc);border-radius:3px}
.secao .sub{color:var(--cinza);font-size:14px;margin:4px 0 14px}
#mapa{height:480px;border-radius:var(--raio);border:1px solid var(--linha);background:#dfe8ee}
.mapa-ctl{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 0}
.chip{background:#fff;border:1px solid var(--linha);border-radius:999px;padding:6px 13px;font-size:13.5px;display:inline-flex;gap:7px;align-items:center}
.chip:hover{border-color:var(--bola-esc);background:var(--bola-claro)}
.chip.ativo{background:var(--tinta);color:#fff;border-color:var(--tinta)}
.chip .n{font-size:11.5px;opacity:.75}
.chip.sec{background:transparent;border-style:dashed}
.leaflet-popup-content{font-family:inherit;font-size:13.5px}
.pop b{font-size:15px}
.pop button{margin-top:8px;background:var(--bola);border:0;border-radius:8px;padding:6px 12px;font-weight:600;width:100%}
.mk{background:var(--bola);border:2.5px solid var(--tinta);border-radius:50%;box-shadow:0 2px 6px rgba(0,0,0,.35);display:grid;place-items:center;font-weight:700;color:var(--tinta);font-size:11px;line-height:1}
.mk.ext{background:#fff}
.mk-lbl{background:var(--tinta);color:#fff;border:0;border-radius:6px;font-weight:600;font-size:12px;padding:2px 7px;box-shadow:none}
.mk-lbl::before{display:none}

.pl-grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.pl-item{background:#fff;border:1px solid var(--linha);border-radius:12px;padding:10px 12px;text-align:left;display:flex;gap:10px;align-items:center}
.pl-item:hover{border-color:var(--bola-esc);background:var(--bola-claro)}
.pl-item .mini{width:64px;height:36px;border-radius:6px;background:#222 center/cover;flex:none}
.pl-item .nm{font-size:13.5px;font-weight:600;line-height:1.25}
.pl-item .q{font-size:12px;color:var(--cinza)}

.voltar{background:transparent;border:0;color:var(--cinza);font-size:14px;margin-bottom:10px;padding:4px 0}
.voltar:hover{color:var(--tinta)}
.cab-cat{border-radius:var(--raio);padding:24px 26px;color:#fff;position:relative;overflow:hidden}
.cab-cat h2{font-size:26px}
.cab-cat p{opacity:.9;font-size:14.5px;margin-top:4px}
.abas{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 6px}
.abas2{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 4px;padding:10px 12px;background:#fff;border:1px solid var(--linha);border-radius:12px}
.abas2 .rot{font-size:12.5px;color:var(--cinza);align-self:center;margin-right:4px}
.info-lista{font-size:13.5px;color:var(--cinza);margin:12px 0}
.busca{width:100%;max-width:460px;padding:10px 14px;border:1px solid var(--linha);border-radius:10px;font:inherit;background:#fff}
.busca:focus{outline:2px solid var(--bola-esc);border-color:var(--bola-esc)}

.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.vid{background:#fff;border:1px solid var(--linha);border-radius:12px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:transform .12s,box-shadow .12s}
.vid:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.08)}
.vid .th{aspect-ratio:16/9;background:#222 center/cover no-repeat;position:relative}
.vid .th .dur{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.8);color:#fff;font-size:12px;padding:2px 6px;border-radius:5px}
.vid .th .dur.s{background:#E62117}
.vid .th .play{position:absolute;inset:0;display:grid;place-items:center;opacity:0;transition:opacity .15s;background:rgba(0,0,0,.25)}
.vid:hover .th .play{opacity:1}
.vid .th .play span{width:52px;height:52px;border-radius:50%;background:var(--bola);display:grid;place-items:center;font-size:20px;padding-left:3px;color:var(--tinta)}
.vid .tx{padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px;flex:1}
.vid .tt{font-size:14.5px;font-weight:600;line-height:1.3}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:auto}
.tg{font-size:11px;padding:2px 7px;border-radius:999px;border:1px solid;white-space:nowrap}
.tg.L{color:var(--c-loc);border-color:#bfe0cc;background:#f0f9f3}
.tg.A{color:var(--c-are);border-color:#b8dbe6;background:#eef8fb}
.tg.T{color:var(--c-tor);border-color:#f0c9b8;background:#fdf3ef}
.tg.P{color:var(--c-luz);border-color:#ecd9a6;background:#fdf8ea}
.tg.U{color:var(--c-uni);border-color:#d8cbea;background:#f6f2fb}
.tg.V{color:var(--c-vis);border-color:#d3d9de;background:#f3f5f7}
.tg.c{color:#555;border-color:#ddd;background:#f6f6f6}

.grupo-titulo{font-size:16px;font-weight:700;margin:24px 0 10px;display:flex;align-items:center;gap:8px}
.grupo-titulo .bol{width:10px;height:10px;border-radius:50%}
.grupo-titulo small{font-weight:400;color:var(--cinza);font-size:13px}
.subgrupo{font-size:13.5px;font-weight:600;color:var(--cinza);margin:14px 0 8px;display:flex;gap:6px;align-items:center}

.modal{position:fixed;inset:0;background:rgba(10,14,12,.84);z-index:2000;display:none;align-items:center;justify-content:center;padding:20px}
.modal.on{display:flex}
.modal-box{background:#111;border-radius:14px;overflow:hidden;width:min(960px,100%);box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal .frame{aspect-ratio:16/9;background:#000}
.modal.vert .modal-box{width:min(420px,100%)}
.modal.vert .frame{aspect-ratio:9/16;max-height:72vh;margin:0 auto}
.modal iframe{width:100%;height:100%;border:0;display:block}
.modal .rod{padding:12px 16px;color:#fff;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.modal .rod .t{font-weight:600;flex:1;min-width:200px}
.modal .rod .t small{display:block;font-weight:400;color:#aab3ad;font-size:12px;margin-top:2px}
.modal .rod a,.modal .rod button{background:#2a332e;color:#fff;border:0;border-radius:8px;padding:7px 12px;font-size:13px;text-decoration:none}
.modal .rod a:hover,.modal .rod button:hover{background:var(--bola);color:var(--tinta)}
.modal .nav{display:flex;gap:6px}

footer{text-align:center;color:var(--cinza);font-size:12.5px;padding:24px 20px 40px}
footer a{color:var(--bola-esc);font-weight:600}

@media (max-width:980px){
  .cards{grid-template-columns:1fr 1fr}
  #mapa{height:380px}
}
@media (max-width:640px){
  .topo-in{padding:10px 14px;gap:10px}
  .logo{width:36px;height:36px}
  .topo h1{font-size:15px;line-height:1.2}
  .topo small{font-size:11.5px}
  .topo .home-btn{padding:6px 10px;font-size:12.5px}
  main{padding:14px 12px 40px}
  .hero{padding:22px 18px}
  .hero h2{font-size:22px}
  .hero p{font-size:14px}
  .hero .nums{gap:8px 18px;display:grid;grid-template-columns:repeat(2,auto);justify-content:start}
  .hero .nums b{font-size:20px}
  .cards{grid-template-columns:1fr;gap:14px;margin-top:16px}
  .card-main .capa{height:110px}
  .card-main .capa .ttl{font-size:17px}
  .secao{margin-top:26px}
  #mapa{height:320px}
  .mapa-ctl,.abas,.abas2{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:6px;scrollbar-width:none}
  .mapa-ctl::-webkit-scrollbar,.abas::-webkit-scrollbar,.abas2::-webkit-scrollbar{display:none}
  .chip{flex:none;white-space:nowrap}
  .cab-cat{padding:18px}
  .cab-cat h2{font-size:20px}
  .cab-cat p{font-size:13.5px}
  .grade{grid-template-columns:1fr;gap:10px}
  .vid{flex-direction:row}
  .vid .th{width:42%;max-width:170px;flex:none;aspect-ratio:16/10}
  .vid .th .play{opacity:1;background:transparent}
  .vid .th .play span{width:34px;height:34px;font-size:13px}
  .vid .tx{padding:8px 10px;gap:6px;min-width:0}
  .vid .tt{font-size:13.5px}
  .tg{font-size:10.5px;padding:1px 6px}
  .modal{padding:0}
  .modal-box{border-radius:0;width:100%}
  .modal .rod{padding:10px 12px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .modal .rod .t{grid-column:1/-1;font-size:14px;min-width:0}
  .modal .nav{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .modal .rod a,.modal .rod button{padding:10px;text-align:center}
  .busca{max-width:none;font-size:16px}
}
@media (hover:none){.vid:hover,.card-main:hover{transform:none;box-shadow:none}}
</style>
</head>

const thumb = id => `https://i.ytimg.com/vi/${id}/hqdefault.jpg`;
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const segs = d => d==="S"?45:d.split(":").map(Number).reduce((a,b)=>a*60+b,0);

/* ---------- Navegação por hash ---------- */
function ir(h){location.hash=h;}
window.addEventListener("hashchange",render);
let mapa=null, listaAtual=[], idxAtual=0;

function render(){
  const h = decodeURIComponent(location.hash.slice(1)).split("/");
  if(mapa){mapa.remove();mapa=null;}
  window.scrollTo(0,0);
  if(h[0]==="cat" && CATS[h[1]]) telaCategoria(h[1],h[2]||"",h[3]||"");
  else if(h[0]==="lugar" && LUG[h[1]]) telaLugar(h[1]);
  else if(h[0]==="pl" && PLS[+h[1]]) telaPlaylist(+h[1]);
  else if(h[0]==="todos") telaTodos(h[1]||"");
  else telaInicio();
}

function contaLugar(k){return V.filter(v=>v.lug===k).length;}

/* ---------- Início ---------- */
function telaInicio(){
  const horas = V.reduce((s,v)=>s+segs(v.d),0)/3600;
  const nLug = Object.keys(LUG).filter(k=>contaLugar(k)).length;
  let html = `
  <section class="hero">
    <span class="tag">Brasil · EUA · Europa · Ásia · África</span>
    <h2>Pickleball Itinerante — o canal organizado</h2>
    <p>Locais, arenas, torneios, PickleLuz, universidades e bastidores, em vídeos curtos separados por tema. Um mesmo vídeo pode aparecer em mais de uma seção.</p>
    <div class="nums">
      <div><b>${V.length}</b><span>vídeos</span></div>
      <div><b>${PLS.length}</b><span>playlists</span></div>
      <div><b>${nLug}</b><span>lugares no mapa</span></div>
      <div><b>${V.filter(short).length}</b><span>Shorts</span></div>
    </div>
  </section>
  <div class="cards">`;
  for(const [k,c] of Object.entries(CATS)){
    const lista = V.filter(c.pertence);
    html += `
    <article class="card-main">
      <div class="capa" style="background-image:url(${thumb(c.capa)})" onclick="ir('cat/${k}')"><div class="ttl">${c.nome}</div></div>
      <div class="faixa" style="background:${c.cor}"></div>
      <div class="corpo">
        <div class="qtd">${lista.length} vídeos · ${c.desc}</div>
        <ul>${c.subs.map(([s,nm])=>`<li><button onclick="ir('cat/${k}/${s}')"><span>${nm}</span><span class="n">${V.filter(v=>c.pertence(v)&&c.sub(v,s)).length}</span></button></li>`).join("")}</ul>
        <button class="abrir" onclick="ir('cat/${k}')">Ver todos →</button>
      </div>
    </article>`;
  }
  const top = Object.keys(LUG).filter(k=>contaLugar(k)).sort((a,b)=>contaLugar(b)-contaLugar(a));
  html += `</div>
  <section class="secao">
    <h3>Mapa do Pickleball Itinerante</h3>
    <p class="sub">Cada ponto mostra quantos vídeos foram gravados no lugar. Clique (ou toque) para ver os vídeos.</p>
    <div id="mapa"></div>
    <div class="mapa-ctl">
      <button class="chip" onclick="zoomRJ()">🔎 Rio e Serra</button>
      <button class="chip" onclick="zoomBR()">🇧🇷 Brasil</button>
      <button class="chip" onclick="zoomMundo()">🌍 Mundo</button>
      ${top.map(k=>`<button class="chip ${LUG[k].reg==='ext'?'sec':''}" onclick="ir('lugar/${k}')">📍 ${LUG[k].nome} <span class="n">${contaLugar(k)}</span></button>`).join("")}
    </div>
  </section>
  <section class="secao">
    <h3>Playlists originais do canal</h3>
    <p class="sub">As ${PLS.length} playlists do YouTube, na ordem do canal.</p>
    <div class="pl-grade">${PLS.map((p,i)=>{const l=V.filter(v=>v.pl.includes(i));return `<button class="pl-item" onclick="ir('pl/${i}')"><span class="mini" style="background-image:url(${thumb(l[0].id)})"></span><span><span class="nm">${esc(p.nome)}</span><br><span class="q">${l.length} vídeos</span></span></button>`}).join("")}</div>
  </section>
  <section class="secao">
    <h3>Todos os vídeos</h3>
    <p class="sub">Lista completa, com busca por título, lugar ou tema.</p>
    <button class="chip ativo" onclick="ir('todos')">Ver os ${V.length} vídeos →</button>
  </section>`;
  document.getElementById("app").innerHTML = html;
  montarMapa();
}

function montarMapa(){
  if(typeof L==="undefined"){document.getElementById("mapa").innerHTML='<p style="padding:20px;color:#555">O mapa não carregou (sem conexão com a biblioteca). Use os botões de lugar abaixo.</p>';return;}
  mapa = L.map("mapa",{scrollWheelZoom:false,worldCopyJump:true});
  const camadas = [
    ["https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",{maxZoom:19,attribution:'Mapa &copy; Esri'}],
    ["https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:'&copy; OpenStreetMap'}]
  ];
  let ic=0, erros=0, base=L.tileLayer(...camadas[0]).addTo(mapa);
  base.on("tileerror",function trocar(){
    if(++erros<4 || ic>=camadas.length-1) return;
    mapa.removeLayer(base); ic++; erros=0;
    base=L.tileLayer(...camadas[ic]).addTo(mapa); base.on("tileerror",trocar);
  });
  for(const [k,c] of Object.entries(LUG)){
    const n = contaLugar(k); if(!n) continue;
    const sz = Math.round(Math.min(40,18+Math.sqrt(n)*2.4));
    const icon = L.divIcon({className:"",html:`<div class="mk ${c.reg==='ext'?'ext':''}" style="width:${sz}px;height:${sz}px">${n}</div>`,iconSize:[sz,sz],iconAnchor:[sz/2,sz/2]});
    const m = L.marker(c.ll,{icon,zIndexOffset:n}).addTo(mapa);
    m.bindPopup(`<div class="pop"><b>${esc(c.nome)}</b><br><small>${REG[c.reg]} · ${n} vídeo(s)</small><button onclick="ir('lugar/${k}')">Ver vídeos →</button></div>`);
    m.bindTooltip(c.nome,{direction:"top",offset:[0,-sz/2],className:"mk-lbl"});
  }
  zoomRJ();
}
const pts = f => Object.entries(LUG).filter(([k,c])=>contaLugar(k)&&f(c)).map(([k,c])=>c.ll);
function zoomRJ(){if(mapa)mapa.fitBounds(pts(c=>["rio","serra","rjint"].includes(c.reg)),{padding:[30,30]});}
function zoomBR(){if(mapa)mapa.fitBounds(pts(c=>c.reg!=="ext"),{padding:[30,30]});}
function zoomMundo(){if(mapa)mapa.fitBounds(pts(()=>true),{padding:[20,20]});}

/* ---------- Categoria ---------- */
function telaCategoria(k,s,lug){
  const c = CATS[k];
  const base = V.filter(c.pertence);
  let lista = s ? base.filter(v=>c.sub(v,s)) : base;
  if(lug) lista = lista.filter(v=>v.lug===lug);
  const nomeSub = s ? c.subs.find(x=>x[0]===s)?.[1] : "";
  let html = `<button class="voltar" onclick="ir('')">← Voltar ao início</button>
  <div class="cab-cat" style="background:${c.grad}"><h2>${c.nome}</h2><p>${c.desc}</p></div>
  <div class="abas">
    <button class="chip ${!s?'ativo':''}" onclick="ir('cat/${k}')">Todos <span class="n">${base.length}</span></button>
    ${c.subs.map(([sk,nm])=>`<button class="chip ${s===sk?'ativo':''}" onclick="ir('cat/${k}/${sk}')">${nm} <span class="n">${base.filter(v=>c.sub(v,sk)).length}</span></button>`).join("")}
  </div>`;
  if(s && c.subgrupo){
    const tot = base.filter(v=>c.sub(v,s));
    const ks = [...new Set(tot.map(c.subgrupo))].sort((a,b)=>tot.filter(v=>v.lug===b).length-tot.filter(v=>v.lug===a).length);
    if(ks.length>1) html += `<div class="abas2"><span class="rot">Lugar:</span>
      <button class="chip ${!lug?'ativo':''}" onclick="ir('cat/${k}/${s}')">Todos <span class="n">${tot.length}</span></button>
      ${ks.map(lk=>`<button class="chip ${lug===lk?'ativo':''}" onclick="ir('cat/${k}/${s}/${lk}')">${LUG[lk].nome} <span class="n">${tot.filter(v=>v.lug===lk).length}</span></button>`).join("")}
    </div>`;
  }
  html += `<p class="info-lista">${lista.length} vídeo(s)${nomeSub?` em <b>${nomeSub}${lug?" · "+LUG[lug].nome:""}</b>`:""}. Toque em um vídeo para assistir; as setas do player passam para o próximo da lista.</p>`;
  listaAtual=[];
  if(!s){
    for(const [sk,nm] of c.subs){
      const l = base.filter(v=>c.sub(v,sk)); if(!l.length) continue;
      html += `<div class="grupo-titulo"><span class="bol" style="background:${c.cor}"></span>${nm} <small>(${l.length})</small></div>${grade(l)}`;
      listaAtual.push(...l);
    }
  } else if(c.subgrupo && !lug){
    const ks = [...new Set(lista.map(c.subgrupo))].sort((a,b)=>lista.filter(v=>v.lug===b).length-lista.filter(v=>v.lug===a).length);
    for(const lk of ks){
      const l = lista.filter(v=>v.lug===lk);
      html += `<div class="subgrupo">📍 ${LUG[lk].nome} (${l.length})</div>${grade(l)}`;
      listaAtual.push(...l);
    }
  } else { html += grade(lista); listaAtual = lista; }
  document.getElementById("app").innerHTML = html;
}

/* ---------- Lugar (a partir do mapa) ---------- */
function telaLugar(k){
  const c = LUG[k];
  const lista = V.filter(v=>v.lug===k);
  const vizinhos = Object.keys(LUG).filter(x=>LUG[x].reg===c.reg && contaLugar(x));
  let html = `<button class="voltar" onclick="ir('')">← Voltar ao mapa</button>
  <div class="cab-cat" style="background:linear-gradient(120deg,#16211B,#46591c)"><h2>📍 ${esc(c.nome)}</h2><p>${REG[c.reg]} · ${lista.length} vídeo(s)</p></div>
  <div class="abas">${vizinhos.map(x=>`<button class="chip ${x===k?'ativo':''}" onclick="ir('lugar/${x}')">${LUG[x].nome} <span class="n">${contaLugar(x)}</span></button>`).join("")}</div>`;
  const usados = new Set(); listaAtual=[];
  for(const cat of Object.values(CATS)){
    const l = lista.filter(v=>cat.pertence(v)&&!usados.has(v.n));
    if(!l.length) continue;
    l.forEach(v=>usados.add(v.n));
    html += `<div class="grupo-titulo"><span class="bol" style="background:${cat.cor}"></span>${cat.nome} <small>(${l.length})</small></div>${grade(l)}`;
    listaAtual.push(...l);
  }
  document.getElementById("app").innerHTML = html;
}

/* ---------- Playlist original ---------- */
function telaPlaylist(i){
  const p = PLS[i];
  const lista = V.filter(v=>v.pl.includes(i));
  document.getElementById("app").innerHTML = `<button class="voltar" onclick="ir('')">← Voltar ao início</button>
  <div class="cab-cat" style="background:linear-gradient(120deg,#16211B,#3a4640)"><h2>▶ ${esc(p.nome)}</h2><p>Playlist do canal · ${lista.length} vídeo(s) · <a href="https://www.youtube.com/playlist?list=${p.id}" target="_blank" rel="noopener" style="color:var(--bola)">abrir no YouTube ↗</a></p></div>
  <p class="info-lista">${lista.length} vídeo(s), na ordem da playlist.</p>${grade(lista)}`;
  listaAtual = lista;
}

/* ---------- Todos com busca ---------- */
function telaTodos(q){
  document.getElementById("app").innerHTML = `<button class="voltar" onclick="ir('')">← Voltar ao início</button>
  <div class="cab-cat" style="background:linear-gradient(120deg,#16211B,#3a4640)"><h2>Todos os vídeos</h2><p>${V.length} vídeos das ${PLS.length} playlists (sem repetição)</p></div>
  <div style="margin:18px 0 6px"><input class="busca" id="busca" placeholder="Buscar por título, lugar ou tema (ex.: Mandala, Flórida, regularizador, kids)…" oninput="filtrar()"></div>
  <p class="info-lista" id="info"></p><div id="res"></div>`;
  const b=document.getElementById("busca"); b.value=q; filtrar(); b.focus();
}
function semAcento(s){return s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();}
function filtrar(){
  const q = semAcento(document.getElementById("busca").value.trim());
  const l = V.filter(v=>{
    if(!q) return true;
    const txt = semAcento(v.t+" "+v.m.map(rotulo).join(" ")+" "+(v.lug?LUG[v.lug].nome:"")+" "+v.pl.map(i=>PLS[i].nome).join(" "));
    return q.split(/\s+/).every(p=>txt.includes(p));
  });
  document.getElementById("info").textContent = `${l.length} vídeo(s)`;
  document.getElementById("res").innerHTML = grade(l);
  listaAtual = l;
}

/* ---------- Componentes ---------- */
function rotulo(m){return NOMES[m]||m;}
function grade(l){
  return `<div class="grade">${l.map(v=>`
    <div class="vid" onclick="abrirVideo(${v.n})" title="${esc(v.t)}">
      <div class="th" style="background-image:url(${thumb(v.id)})">${short(v)?'<span class="dur s">Shorts</span>':`<span class="dur">${v.d}</span>`}<div class="play"><span>▶</span></div></div>
      <div class="tx"><div class="tt">${esc(v.t)}</div>
        <div class="tags">${v.m.filter(m=>m!=="L").map(m=>`<span class="tg ${m[0]}">${rotulo(m)}</span>`).join("")}${v.lug?`<span class="tg ${v.m.includes("L")?"L":"c"}">📍 ${esc(LUG[v.lug].nome.replace(/ \(.*\)$/,""))}</span>`:""}</div>
      </div>
    </div>`).join("")}</div>`;
}
function abrirVideo(n){
  idxAtual = listaAtual.findIndex(v=>v.n===n); if(idxAtual<0){listaAtual=V;idxAtual=V.findIndex(v=>v.n===n);}
  mostrar();
  document.getElementById("modal").classList.add("on");
}
function mostrar(){
  const v = listaAtual[idxAtual];
  document.getElementById("modal").classList.toggle("vert", short(v));
  document.getElementById("player").src = `https://www.youtube-nocookie.com/embed/${v.id}?autoplay=1&rel=0`;
  document.getElementById("modal-t").innerHTML = `${esc(v.t)}<small>${idxAtual+1} de ${listaAtual.length} · playlist: ${v.pl.map(i=>esc(PLS[i].nome)).join(" · ")}</small>`;
  document.getElementById("modal-yt").href = short(v) ? `https://www.youtube.com/shorts/${v.id}` : `https://www.youtube.com/watch?v=${v.id}`;
}
function passo(d){idxAtual=(idxAtual+d+listaAtual.length)%listaAtual.length;mostrar();}
function fecharVideo(){document.getElementById("modal").classList.remove("on");document.getElementById("player").src="";}
document.addEventListener("keydown",e=>{
  if(!document.getElementById("modal").classList.contains("on"))return;
  if(e.key==="Escape")fecharVideo(); if(e.key==="ArrowRight")passo(1); if(e.key==="ArrowLeft")passo(-1);
});
document.getElementById("rod-info").textContent = `${PLS.length} playlists · ${V.length} vídeos · atualizado em 08/11/2026`;
render();
</script>
</body>
</html>
